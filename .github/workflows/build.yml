name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: ubuntu-latest already ships the Android SDK
      # at /usr/local/lib/android/sdk, and setup-android v3 tries to install
      # the obsolete "tools" package via sdkmanager, which fails with exit 1.
      # AGP finds the preinstalled SDK via ANDROID_HOME.

      - name: Build debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skylight-escape-hatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
