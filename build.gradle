// Top-level build file. No dependencies beyond the Android Gradle Plugin,
// so a first build only needs the AGP + SDK 33 already cached from grafmote.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.application:8.1.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
