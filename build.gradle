// Top-level build file. No dependencies beyond the Android Gradle Plugin.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

// No allprojects repositories here: settings.gradle sets
// repositoriesMode FAIL_ON_PROJECT_REPOS, so dependency repositories
// must come from settings.gradle only. The buildscript repositories
// above are separate and are still allowed.
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
