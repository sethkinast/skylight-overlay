name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release upload below needs write access to contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: ubuntu-latest already ships the Android SDK
      # at /usr/local/lib/android/sdk, and setup-android v3 tries to install
      # the obsolete "tools" package via sdkmanager, which fails with exit 1.
      # AGP finds the preinstalled SDK via ANDROID_HOME.

      # Stable signing: decode the keystore from the KEYSTORE_BASE64
      # secret to an ephemeral runner file. The file is never committed
      # and the runner is discarded after the job. Secret values are
      # passed only via env, never printed in the workflow.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skylight.keystore"

      - name: Build debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/skylight.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          gradle-version: '8.2'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skylight-escape-hatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # GitHub always downloads artifacts as a zip, so the artifact
      # alone can never be a direct APK download. Also publish the
      # APK as an asset on a rolling "latest" release, which GitHub
      # serves as a plain .apk file: Releases > Latest CI build >
      # app-debug.apk. The artifact upload above is kept for CI history.
      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CI build
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
