// Legacy apply, matching the buildscript classpath in the root
// build.gradle. Using `plugins { id ... }` without a version here
// would fail to resolve the plugin; this form does not.
apply plugin: 'com.android.application'

// Stable signing: when CI supplies a keystore via environment
// (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, decoded
// in the workflow from the KEYSTORE_BASE64 secret), use it for both
// debug and release builds, so successive CI builds share one
// signature and install over each other with grants intact.
// Without those env vars, fall back to the default debug signing,
// so local builds without secrets still work. No secret value is
// ever in this file; the keystore file itself is ephemeral on the
// CI runner and is never committed.
def signingStoreFile = System.getenv("KEYSTORE_FILE")
def signingStorePassword = System.getenv("KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("KEY_ALIAS")
def signingKeyPassword = System.getenv("KEY_PASSWORD")
def stableSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'net.cogdev.skylightoverlay'
    compileSdk 33

    defaultConfig {
        applicationId 'net.cogdev.skylightoverlay'
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        if (stableSigning) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (stableSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            if (stableSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
